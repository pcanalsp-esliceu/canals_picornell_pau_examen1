<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estils.css">
    <link rel="stylesheet" href="css/galeria-flex.css">
    <title>Galeria(flexbox)</title>
</head>
<body>
    <header>
        <h1>Bicis tramuntana</h1>
        <p class="banner">Lloga la bici per qualsevol d'aquestes rutes: 15$ el dia</p>
        <nav>
            <ul>
                <li><a href="index.html">Inici</a></li>
                <li><a href="contacte.html">Contacte</a></li>
                <li><a href="galeria.html">Galeria</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Rutes en bici per Mallorca</h2>
        <div class="galeria">
            <figure>
                <img src="galeria/sa_calobra.jpg" alt="Carretera de revolts entre penya-segats de la Serra de tramuntana">
                <figcaption>Sa Calobra <span class="km">38 km</span></figcaption>
            </figure>
            <figure>
                <img src="galeria/formentor.jpg" alt="Cap de Formentor">
                <figcaption>Cap de Formentor <span class="km">42 km</span></figcaption>
            </figure>
            <figure>
                <img src="galeria/valldemossa.jpg" alt="valldemossa">
                <figcaption>Valldemossa <span class="km">30 km</span></figcaption>
            </figure>
            <figure>
                <img src="galeria/port_soller.jpg" alt="">
                <figcaption>Port de Soller <span class="km">25 km</span></figcaption>
            </figure>
            <figure>
                <img src="galeria/ametllers.jpg" alt="ametllers">
                <figcaption>Els ametllers en flor <span class="km">35 km</span></figcaption>
            </figure>
            <figure>
                <img src="galeria/es_trenc.jpg" alt="Es trenc">
                <figcaption>Es Trenc <span class="km">28 km</span></figcaption>
            </figure>
            <figure>
                <img src="galeria/lluc.jpg" alt="Lluc">
                <figcaption>Santuari de Lluc <span class="km">45 km</span></figcaption>
            </figure>
            <figure>
                <img src="galeria/pollenca.jpg" alt="Pont roma de Pollença">
                <figcaption>Pont roma de Pollença <span class="km">20 km</span></figcaption>
            </figure>
            <figure>
                <img src="galeria/salines.jpg" alt="Ses Salines">
                <figcaption>Ses Salines <span class="km">32 km</span></figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <h2>Horari d'obertura</h2>
        <ol>
            <li>Dilluns a divendres: 9 a 20</li>
            <li>Dissabte: 9 a 14</li>
            <li>Diumenge: tancat</li>
        </ol>
        <p>Fet per Pau Canals Picornell</p>
    </footer>
</body>
</html>
